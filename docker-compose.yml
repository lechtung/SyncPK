services:
  syncpk-server:
    image: ghcr.io/lechtung/syncpk:latest
    container_name: syncpk-server
    restart: unless-stopped
    environment:
      # Timezone for the container. Change to your local zone (e.g. Europe/Madrid, America/New_York)
      - TZ=Etc/UTC
      # - PUID=1000 # Uncomment and set your local user ID if running on a NAS (e.g. Synology, Unraid)
      # - PGID=1000 # Uncomment and set your local group ID if running on a NAS
    ports:
      # If you are publishing directly to the internet, use a reverse proxy and switch to "127.0.0.1:8000:8000" to avoid bypassing the ufw firewall.
      - "8000:8000"
    volumes:
      # All persistence (DB, JSON config, .env, and image cache) resides in ./data
      - ./data:/app/data